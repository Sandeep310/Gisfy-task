apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devops-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: sndeep310/postgres-db:latest
          imagePullPolicy: Always

          env:
            - name: POSTGRES_DB
              value: usersdb

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: postgres

          ports:
            - containerPort: 5432