name: Full Stack CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Build, Scan & Push Docker Images
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build Backend Image
        run: |
          docker build -t $DOCKER_USERNAME/backend:latest ./backend

      - name: Build Frontend Image
        run: |
          docker build -t $DOCKER_USERNAME/frontend:latest ./frontend

      - name: Build Database Image
        run: |
          docker build -t $DOCKER_USERNAME/postgres-db:latest ./database

      - name: Push Backend Image
        run: docker push $DOCKER_USERNAME/backend:latest

      - name: Push Frontend Image
        run: docker push $DOCKER_USERNAME/frontend:latest

      - name: Push Database Image
        run: docker push $DOCKER_USERNAME/postgres-db:latest

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
          gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Backend Image
        run: trivy image $DOCKER_USERNAME/backend:latest

      - name: Scan Frontend Image
        run: trivy image $DOCKER_USERNAME/frontend:latest

      - name: Scan Database Image
        run: trivy image $DOCKER_USERNAME/postgres-db:latest

      - name: Generate Trivy Report
        run: |
          echo "===== Backend =====" > trivy-report.txt
          trivy image -f table $DOCKER_USERNAME/backend:latest >> trivy-report.txt

          echo "" >> trivy-report.txt
          echo "===== Frontend =====" >> trivy-report.txt
          trivy image -f table $DOCKER_USERNAME/frontend:latest >> trivy-report.txt

          echo "" >> trivy-report.txt
          echo "===== Database =====" >> trivy-report.txt
          trivy image -f table $DOCKER_USERNAME/postgres-db:latest >> trivy-report.txt

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  cd:
    name: Deploy to Amazon EKS
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name eks-cluster

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/

      - name: Verify Deployment
        run: |
          kubectl get nodes
          kubectl get namespaces
          kubectl get deployments -n devops-app
          kubectl get pods -n devops-app
          kubectl get svc -n devops-app
          kubectl get ingress -n devops-app