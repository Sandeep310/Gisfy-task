name: Docker Image Build and Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build Backend Image
        run: |
          docker build -t $DOCKER_USERNAME/backend:latest ./backend

      - name: Build Frontend Image
        run: |
          docker build -t $DOCKER_USERNAME/frontend:latest ./frontend

      - name: Push Backend Image
        run: |
          docker push $DOCKER_USERNAME/backend:latest

      - name: Push Frontend Image
        run: |
          docker push $DOCKER_USERNAME/frontend:latest

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy Scan Backend
        run: |
          echo "===== BACKEND IMAGE =====" > trivy-report.txt
          trivy image -f table $DOCKER_USERNAME/backend:latest >> trivy-report.txt

      - name: Trivy Scan Frontend
        run: |
          echo "" >> trivy-report.txt
          echo "===== FRONTEND IMAGE =====" >> trivy-report.txt
          trivy image -f table $DOCKER_USERNAME/frontend:latest >> trivy-report.txt

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt